name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Auto-fix lint with ruff
        run: ruff check --fix .

      - name: Auto-format with ruff
        run: ruff format .

      - name: Verify no lint errors remain
        run: ruff check .

      - name: Quick pipeline test
        run: |
          python -c "import pandas; import numpy; import sklearn; import xgboost; import shap; import joblib; import matplotlib; print('All imports OK')"
          python main.py --data data/heart.csv
          echo "Pipeline test passed"